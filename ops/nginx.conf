server {
    listen 80;
    listen [::]:80;
    server_name gow.bertho.tech;
    root /var/lib/gow-site/current;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types application/javascript application/wasm text/css;
    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        try_files $uri @previous_assets;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location @previous_assets {
        root /var/lib/gow-site/previous;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
