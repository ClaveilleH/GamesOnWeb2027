server {
    listen 80;
    listen [::]:80;
    server_name gow.bertho.tech;
    root /var/lib/gow-site/current;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types application/javascript application/wasm text/css;
    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ =404;
    }

    # Modèles de public/models/ : absents du mime.types de Nginx, ils partiraient en octet-stream non compressé.
    # Un bloc types remplace la table héritée : il reste limité à ce dossier.
    location /models/ {
        types {
            model/gltf-binary glb;
            model/obj obj;
        }
        gzip_types model/gltf-binary model/obj;
    }

    location /assets/ {
        try_files $uri @previous_assets;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location @previous_assets {
        root /var/lib/gow-site/previous;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
