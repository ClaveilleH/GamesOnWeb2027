name: Site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm test
      - name: Préparer le site testé
        if: github.event_name == 'push'
        working-directory: dist
        run: |
          echo "$GITHUB_SHA" > version.txt
          zip -qr ../site.zip .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: site
          path: site.zip
          if-no-files-found: error
          retention-days: 3

  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: publication-gow
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
      - name: Publier la version de main pour le VPS
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Un commit plus récent est arrivé sur main."
            exit 0
          fi
          tag="site-$GITHUB_SHA"
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null) || draft=missing
          if [[ "$draft" == false ]]; then exit 0; fi
          if [[ "$draft" == missing ]]; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Site ${GITHUB_SHA:0:8}" --notes "Version testée de main."
          fi
          gh release upload "$tag" site.zip --clobber
          gh release edit "$tag" --draft=false --latest
